name: Bitrix - listar configuracao

# Rodado manualmente: lista funis, etapas, origens e campos do Bitrix24 (só leitura).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Listar configuracao do Bitrix
        run: npm run bitrix:config -w jobs
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
