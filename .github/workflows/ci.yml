name: Verificacao do codigo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Procurar senhas/tokens no codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            git /repo --redact --no-banner --exit-code 1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Testar funcoes do site (periodo, formatos, planilha)
        run: npm run test:web
      - name: Testar regras de negocio (SQL)
        run: npm run test:sql

  gateway:
    name: Testar o gateway do ERP (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias do gateway
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]" pyodbc pytest
          python -c "import pyodbc" || {
            sudo apt-get update && sudo apt-get install -y unixodbc
            python -c "import pyodbc"
          }
      - name: Testes do gateway
        run: python -m pytest gateway/tests -q
